name: Deploy to Azure Functions

# Runs after CI succeeds on `main`, plus an on-demand manual trigger.
#
# The Function App runs on a Windows Consumption plan, which supports the classic Kudu zip-push
# (`az functionapp deployment source config-zip`) together with WEBSITE_RUN_FROM_PACKAGE="1" (set in
# the ops repo's Terraform). So this workflow just builds the package and pushes it in one step --
# the platform stores and mounts it itself. No deployment blob, no SAS, and no
# /admin/host/synctriggers call (all of which only existed to work around Linux Consumption's
# URL-only WEBSITE_RUN_FROM_PACKAGE, which reliably wedged the container after each swap).
#
# Auth is passwordless via OIDC: azure/login@v2 federates into a user-assigned identity (see the ops
# repo's github_oidc.tf), so there are no long-lived deploy secrets in this repo -- only the
# non-secret AZURE_CLIENT_ID / AZURE_TENANT_ID / AZURE_SUBSCRIPTION_ID / AZURE_RESOURCE_GROUP /
# AZURE_FUNCTIONAPP_NAME variables.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for OIDC federation with azure/login

concurrency:
  group: deploy-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Azure Functions
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prune to production dependencies for the deployment payload
        run: npm ci --omit=dev

      - name: Create deployment package
        run: |
          mkdir -p package-stage
          cp -r dist node_modules package-stage/
          cp package.json package-lock.json host.json package-stage/
          (cd package-stage && zip -r -q ../deploy.zip .)

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy package (zip-push)
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_FUNCTIONAPP_NAME }}" \
            --src deploy.zip \
            --build-remote false
